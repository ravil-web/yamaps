name: Crocs CDN diagnostic

on:
  push:
    branches:
      - crocs-cdn-diag-20260627

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests beautifulsoup4
      - run: python tmp_crocs_diag/diag.py
      - uses: actions/upload-artifact@v4
        with:
          name: crocs-cdn-diag
          path: tmp_crocs_diag/diag.json
          retention-days: 1

name: Product image search

on:
  push:
    branches:
      - image-search-temp-20260626
    paths:
      - 'tools/product_image_search/**'
      - '.github/workflows/product-image-search.yml'

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 pillow
      - name: Find and validate product images
        run: python tools/product_image_search/search.py
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: product-image-search-results
          path: tools/product_image_search/outputs/
          retention-days: 1

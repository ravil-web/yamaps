name: Exact product image parser

on:
  pull_request:
    branches:
      - rework

jobs:
  parse:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 pillow
      - name: Rebuild input and run parser
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: 4
        run: |
          cat tmp_exact_parser/records.part*.txt > tmp_exact_parser/records.json.gz.b64
          mkdir -p tmp_exact_parser/outputs
          python tmp_exact_parser/exact_image_parser.py 2>&1 | tee tmp_exact_parser/outputs/run_${SHARD}.log
      - name: Upload parser results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-image-results-${{ matrix.shard }}
          path: tmp_exact_parser/outputs/
          retention-days: 1

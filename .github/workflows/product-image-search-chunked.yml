name: Product image search chunked

on:
  push:
    branches:
      - image-search-temp-20260626
  pull_request:
    branches:
      - rework

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests beautifulsoup4 pillow
      - name: Collect direct image URLs
        shell: bash
        run: |
          mkdir -p tools/product_image_search/outputs
          set +e
          python tools/product_image_search/runner.py > tools/product_image_search/outputs/run.log 2>&1
          echo "$?" > tools/product_image_search/outputs/exit_code.txt
          cat tools/product_image_search/outputs/run.log
          exit 0
      - name: Upload collected data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: direct-image-results-chunked
          path: tools/product_image_search/outputs/
          retention-days: 1

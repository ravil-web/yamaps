name: Exact product image parser fixed

on:
  pull_request:
    branches:
      - rework

jobs:
  parse:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 pillow
      - name: Rebuild exact inputs and parse
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: 4
        run: |
          mkdir -p tmp_exact_parser/outputs
          head -c 5790 tmp_exact_parser/records.part1.txt > tmp_exact_parser/records.json.gz.b64
          cat tmp_exact_parser/records.fixchar >> tmp_exact_parser/records.json.gz.b64
          tail -c +5791 tmp_exact_parser/records.part1.txt >> tmp_exact_parser/records.json.gz.b64
          cat tmp_exact_parser/records.part2.txt >> tmp_exact_parser/records.json.gz.b64
          head -c 810 tmp_exact_parser/records.part3.txt >> tmp_exact_parser/records.json.gz.b64
          cat tmp_exact_parser/records.missing.01 tmp_exact_parser/records.missing.02 tmp_exact_parser/records.missing.03 tmp_exact_parser/records.missing.04 >> tmp_exact_parser/records.json.gz.b64
          tail -c +811 tmp_exact_parser/records.part3.txt >> tmp_exact_parser/records.json.gz.b64
          test "$(wc -c < tmp_exact_parser/records.json.gz.b64)" -eq 17664
          cat tmp_exact_parser/parser.b64.part1 tmp_exact_parser/parser.b64.part2 tmp_exact_parser/parser.b64.part3 tmp_exact_parser/parser.tail.01 tmp_exact_parser/parser.tail.02 tmp_exact_parser/parser.tail.03 tmp_exact_parser/parser.tail.04 tmp_exact_parser/parser.tail.05 tmp_exact_parser/parser.tail.06 tmp_exact_parser/parser.tail.07a tmp_exact_parser/parser.tail.07b > tmp_exact_parser/parser.complete.b64
          base64 -d tmp_exact_parser/parser.complete.b64 > tmp_exact_parser/exact_image_parser.py
          cat tmp_exact_parser/parser.suffix.py >> tmp_exact_parser/exact_image_parser.py
          python -m py_compile tmp_exact_parser/exact_image_parser.py
          python tmp_exact_parser/exact_image_parser.py 2>&1 | tee tmp_exact_parser/outputs/run_${SHARD}.log
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-fixed-results-${{ matrix.shard }}
          path: tmp_exact_parser/outputs/
          retention-days: 1
